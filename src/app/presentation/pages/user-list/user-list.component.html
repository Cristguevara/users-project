<section class="card">
  <div class="section-header">
    <h2>Usuarios</h2>
    <p-button
      label="Agregar usuario"
      icon="pi pi-plus"
      (onClick)="goToCreate()"
    />
  </div>

  <div class="list-toolbar">
    <span class="p-input-icon-left search-box">
      <i class="pi pi-search"></i>
      <input
        type="text"
        pInputText
        placeholder="Buscar por nombre o correo"
        [ngModel]="searchTerm()"
        (ngModelChange)="onSearch($event)"
      />
    </span>
  </div>

  <p-table
    [value]="users()"
    [loading]="loading()"
    [paginator]="users().length > 8"
    [rows]="8"
    styleClass="p-datatable-striped"
    responsiveLayout="scroll"
  >
    <ng-template pTemplate="header">
      <tr>
        @for (col of textColumns; track col.id) {
          <th>{{ col.header }}</th>
        }
        <th>Estado</th>
        <th style="width: 16rem">Acciones</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-user>
      <tr>
        @for (col of textColumns; track col.id) {
          <td>{{ cell(user, col.id) }}</td>
        }
        <td>
          <p-tag [value]="user.status" [severity]="statusSeverity(user.status)" />
        </td>
        <td>
          <div class="actions-cell">
            <p-button
              label="Editar"
              icon="pi pi-pencil"
              severity="secondary"
              [outlined]="true"
              size="small"
              (onClick)="goToEdit(user)"
            />
            <p-button
              [label]="toggleLabel(user)"
              [icon]="toggleIcon(user)"
              [severity]="toggleSeverity(user)"
              [outlined]="true"
              size="small"
              [loading]="changingStatusId() === user.id"
              (onClick)="toggleStatus(user)"
            />
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td [attr.colspan]="textColumns.length + 2" style="text-align: center; padding: 2rem">
          No hay usuarios para mostrar.
        </td>
      </tr>
    </ng-template>
  </p-table>
</section>
